<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e8">
  <title>台所ガイド | ベーコンと玉ねぎのパスタ</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <span class="app-name">台所ガイド</span>
      <p id="mode" class="mode" hidden></p>
    </header>
    <h1 id="recipe-name">ベーコンと玉ねぎのパスタ</h1>

    <div class="workspace">
      <section class="guide panel" aria-labelledby="guide-heading">
        <h2 id="guide-heading">調理ガイド</h2>
        <p id="instruction" class="instruction" role="status">材料がそろったら、料理を始めましょう。</p>
        <div id="recipe-choice">
          <label>具材 <select id="protein"><option value="bacon">ベーコン</option><option value="tuna">ツナ缶</option></select></label>
          <label>作り方 <select id="method"><option value="standard">鍋とフライパン</option><option value="onePan">深めのフライパンだけ</option></select></label>
        </div>
        <p id="gear-hint"></p>
        <div id="start-actions" class="actions">
          <button id="start" type="button" disabled>すぐに料理する</button>
          <a id="pantry-link" href="./pantry.html">食材・道具を確認する</a>
        </div>
        <label id="demo-timer-option" hidden><input id="demo-timer" type="checkbox"> デモ用タイマー（最長10秒）</label>
        <p id="recipe-source" role="status"></p>
        <p id="completion" hidden><a id="finish-link" href="./pantry.html#usage">使った食材を確認する</a></p>
        <form id="voice-form" hidden>
          <label for="utterance">今の調理状況</label>
          <p id="input-help">Aqua Voiceで話し、Enterで送信。</p>
          <div class="input-row">
            <input id="utterance" autocomplete="off" aria-describedby="input-help" placeholder="例：お湯は沸いた。玉ねぎは切った。">
            <button type="submit">送信</button>
          </div>
          <div class="actions">
            <button id="repeat" class="secondary" type="button">もう一回聞く</button>
            <button id="reset" class="secondary" type="button">最初に戻る</button>
          </div>
        </form>
      </section>

      <aside class="sidebar">
        <section class="timer panel" aria-labelledby="timer-heading">
          <h2 id="timer-heading">茹で時間</h2>
          <output id="remaining" role="timer" aria-live="off">--:--</output>
          <p id="timer-status" role="status">パスタを入れたら、茹で時間を伝えてください。</p>
        </section>
        <section class="ingredients panel" aria-labelledby="ingredients-heading">
          <h2 id="ingredients-heading">材料 <span>1人分</span></h2>
          <dl id="recipe-ingredients">
            <div><dt>パスタ</dt><dd>100 g</dd></div>
            <div><dt>ベーコン</dt><dd>40 g</dd></div>
            <div><dt>玉ねぎ</dt><dd>1/4個</dd></div>
            <div><dt>オリーブオイル</dt><dd>小さじ2</dd></div>
            <div><dt>塩・こしょう</dt><dd>適量</dd></div>
          </dl>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
