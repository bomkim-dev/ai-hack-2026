<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <title>ミミシェフ | 声で進める料理ガイド</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <span class="app-name"><span class="brand-mark" aria-hidden="true"></span>ミミシェフ</span>
      <p id="mode" class="mode" hidden></p>
    </header>
    <h1 id="recipe-name">ベーコンと玉ねぎのパスタ</h1>

    <div class="workspace">
      <section class="guide panel" aria-labelledby="guide-heading">
        <h2 id="guide-heading">調理ガイド</h2>
        <p id="instruction" class="instruction" role="status">材料がそろったら、料理を始めましょう。</p>
        <section id="boil-timer" class="timer" aria-labelledby="timer-heading" hidden>
          <h3 id="timer-heading">茹で時間</h3>
          <output id="remaining" role="timer" aria-live="off">--:--</output>
          <p id="timer-status" role="status">パスタを入れたら、茹で時間を伝えてください。</p>
        </section>
        <div id="recipe-choice">
          <label>具材 <select id="protein"><option value="bacon">ベーコン</option><option value="tuna">ツナ缶</option></select></label>
          <label>作り方 <select id="method"><option value="standard">鍋とフライパン</option><option value="onePan">深めのフライパンだけ</option></select></label>
        </div>
        <p id="gear-hint"></p>
        <div id="start-actions" class="actions">
          <button id="start" type="button" disabled>すぐに料理する</button>
          <a id="pantry-link" href="./pantry.html">食材・道具を確認する</a>
        </div>
        <label id="demo-timer-option" hidden><input id="demo-timer" type="checkbox"> デモ用タイマー（最長10秒）</label>
        <p id="recipe-source" role="status"></p>
        <p id="completion" hidden><a id="finish-link" href="./pantry.html#usage">使った食材を確認する</a></p>
        <div id="conversation-log" class="conversation-log" role="log"
             aria-label="調理中のやり取り" aria-relevant="additions" tabindex="0" hidden>
          <ol id="messages" class="messages"></ol>
        </div>
        <form id="voice-form" class="composer" hidden>
          <label for="utterance">今の調理状況</label>
          <div class="input-row">
            <input id="utterance" autocomplete="off" enterkeyhint="send" maxlength="500" aria-describedby="input-help" placeholder="例：お湯は沸いた。玉ねぎは切った。">
            <button type="submit">送信</button>
          </div>
          <p id="input-help">手動では「送信」か <kbd>Enter</kbd>。Mac 版 Aqua Voice の入力は自動送信もできます。</p>
          <div class="composer-actions">
            <div class="voice-actions">
              <button id="conversation" type="button" aria-describedby="conversation-status" hidden>会話を始める</button>
              <label class="aqua-auto-send"><input id="aqua-auto-send" type="checkbox"> Aqua Voice の入力を自動送信</label>
            </div>
            <div class="utility-actions">
              <button id="repeat" class="quiet" type="button">もう一回聞く</button>
              <button id="reset" class="quiet" type="button">最初に戻る</button>
            </div>
          </div>
          <p id="conversation-status" role="status"></p>
          <p id="voice-status" role="status"></p>
        </form>
      </section>

      <aside class="ingredients panel" aria-labelledby="ingredients-heading">
        <h2 id="ingredients-heading">材料 <span>1人分</span></h2>
        <dl id="recipe-ingredients">
          <div><dt>パスタ</dt><dd>100 g</dd></div>
          <div><dt>ベーコン</dt><dd>40 g</dd></div>
          <div><dt>玉ねぎ</dt><dd>1/4個</dd></div>
          <div><dt>オリーブオイル</dt><dd>小さじ2</dd></div>
          <div><dt>塩・こしょう</dt><dd>適量</dd></div>
        </dl>
      </aside>
    </div>
  </main>
</body>
</html>
